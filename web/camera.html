<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRFlux 摄像头扫码</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px; margin: 0 auto; padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white; border-radius: 12px; padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 { color: #333; }
    .nav { display: flex; gap: 20px; margin-bottom: 20px; }
    .nav a { color: #667eea; text-decoration: none; font-weight: 600; }
    .nav a:hover { text-decoration: underline; }
    .camera-panel {
      background: #000; border-radius: 8px; padding: 10px; text-align: center;
    }
    #camera-feed, #captured-image {
      max-width: 100%; border-radius: 4px;
    }
    #captured-image { display: none; }
    canvas { display: none; }
    .controls { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; padding: 12px 24px; border-radius: 6px;
      cursor: pointer; font-size: 14px; font-weight: 600;
    }
    button:hover { transform: translateY(-2px); }
    button.secondary { background: #6c757d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      margin-top: 15px; padding: 15px; border-radius: 6px; border-left: 4px solid #4caf50;
      background: #e8f5e9; word-break: break-all;
    }
    .result.error { background: #ffebee; border-left-color: #f44336; }
    .result.info { background: #e3f2fd; border-left-color: #2196f3; }
    .status { margin: 10px 0; padding: 8px; background: #f0f0f0; border-radius: 4px; font-size: 14px; }
    .note {
      margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 6px;
      border-left: 4px solid #2196f3; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 QRFlux 摄像头扫码</h1>
    <div class="nav">
      <a href="/">编解码</a>
      <a href="/camera">摄像头扫码</a>
    </div>

    <div class="camera-panel">
      <video id="camera-feed" autoplay playsinline></video>
      <img id="captured-image" alt="Captured">
    </div>
    <canvas id="capture-canvas"></canvas>

    <div class="controls">
      <button onclick="startCamera()">启动摄像头</button>
      <button onclick="captureAndDecode()" id="capture-btn" disabled>捕获并解码</button>
      <button onclick="stopCamera()" class="secondary">停止摄像头</button>
    </div>

    <div id="status" class="status">摄像头未启动</div>
    <div id="result"></div>

    <div class="note">
      <strong>💡 说明：</strong>
      <p>使用浏览器摄像头捕获 QR 码图像，通过 jsQR 库解码。</p>
      <p>支持后置摄像头（移动设备）和前置摄像头。</p>
    </div>
  </div>

  <!-- jsQR library for QR decoding -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.2/dist/jsQR.js"></script>
  <script>
    let videoStream = null;
    let scanning = false;

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function showResult(text, type) {
      const div = document.getElementById('result');
      div.innerHTML = `<div class="result ${type || ''}">${text}</div>`;
    }

    async function startCamera() {
      try {
        const constraints = {
          video: {
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };
        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        document.getElementById('camera-feed').srcObject = videoStream;
        document.getElementById('capture-btn').disabled = false;
        setStatus('✅ 摄像头已启动');
        showResult('摄像头已启动，点击"捕获并解码"扫描 QR 码', 'info');
      } catch (e) {
        setStatus('❌ 摄像头启动失败: ' + e.message);
        showResult('摄像头启动失败: ' + e.message, 'error');
      }
    }

    function captureAndDecode() {
      if (!videoStream) { showResult('请先启动摄像头', 'error'); return; }
      const video = document.getElementById('camera-feed');
      const canvas = document.getElementById('capture-canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      // Try to decode from canvas
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'attemptBoth'
      });

      if (code) {
        showResult(`✅ QR 码解码成功！<br><br><strong>数据:</strong> ${code.data}<br><br><strong>位置:</strong> (${code.location.topLeftCorner.x.toFixed(0)}, ${code.location.topLeftCorner.y.toFixed(0)})`, '');
        setStatus('✅ 解码成功');
        // Show captured image
        const img = document.getElementById('captured-image');
        img.src = canvas.toDataURL('image/png');
        img.style.display = 'block';
      } else {
        showResult('❌ 未检测到 QR 码，请调整角度和距离后重试', 'error');
        setStatus('❌ 未检测到 QR 码');
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
        document.getElementById('camera-feed').srcObject = null;
        document.getElementById('capture-btn').disabled = true;
        setStatus('摄像头已停止');
      }
    }

    // Auto-scan mode: continuously scan every 500ms
    function startAutoScan() {
      scanning = true;
      const scan = () => {
        if (!scanning || !videoStream) return;
        captureAndDecode();
        if (scanning) setTimeout(scan, 500);
      };
      scan();
    }
  </script>
</body>
</html>
